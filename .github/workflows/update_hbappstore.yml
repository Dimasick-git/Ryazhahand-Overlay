# Author: Dimasick-git
name: Update HB App Store downloads

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

# github-actions[bot] по умолчанию идёт с read-only GITHUB_TOKEN -- push
# в свою же ветку 403'ил ("Permission to .../Ryazhahand-Overlay.git denied
# to github-actions[bot]"). Контентный write нужен только этому job'у.
permissions:
  contents: write

# Не допускаем параллельных запусков schedule и workflow_dispatch:
# оба обновляют один и тот же JSON и отправляют коммит в main.
concurrency:
  group: update-hbappstore
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Без явного token: actions/checkout сохраняет GITHUB_TOKEN в
          # extraheader, и git push идёт через тот же токен. Тогда
          # permissions: contents: write выше реально применяется к push.
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Fetch and format download count
        run: |
          set -euo pipefail
          JSON_URL="https://switch.cdn.fortheusers.org/repo.json"

          # Fetch download count. Не продолжаем с пустыми или устаревшими
          # данными при ошибке сети либо некорректном JSON.
          count=$(curl --fail --silent --show-error --location --retry 3 "$JSON_URL" \
            | jq -e '.packages | map(select(.name == "RyzhandOverlay"))[0].app_dls // 0')

          # Format as compact number (k for thousands)
          if [ "$count" -ge 1000 ]; then
            display=$(printf "%.0fk" $(echo "$count/1000" | bc -l))
          else
            display=$count
          fi

          # Write JSON to file
          mkdir -p .github
          echo "{\"schemaVersion\":1,\"label\":\"hb app store\",\"message\":\"$display\"}" > .github/hbappstore.json

      - name: Commit and push
        run: |
          git config user.name "Dimasick-git"
          git config user.email "dimaorynchukk@gmail.com"
          git add .github/hbappstore.json
          git diff-index --quiet HEAD || git commit -m "Update download count"
          
          # Fetch latest remote changes and rebase to avoid push rejection.
          # Не маскируем конфликт: workflow должен завершиться ошибкой, а не
          # пытаться отправить незавершённый rebase.
          git fetch origin main
          git rebase origin/main
          
          # Push the checked-out commit explicitly to the tracked main branch.
          git push origin HEAD:main
