# Author: Dimasick-git
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v2.3.0)'
        required: true
        type: string

permissions:
  contents: write

# Два запуска для одного тега не должны одновременно заменять одни и те же
# release assets. Запуски для разных тегов по-прежнему независимы.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Релиз ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    container:
      # Пинимся на тот же образ, что и build.yml -- он проверенно собирает
      # проект. :latest мог подтянуть другой тулчейн и сломать релиз.
      image: devkitpro/devkita64:20251231
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # workflow_dispatch должен собирать именно существующий тег, а не
          # HEAD ветки по умолчанию. При push-теге github.ref уже указывает на него.
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Определить и проверить тег
        id: tag
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Некорректный тег релиза: $TAG"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse --verify "refs/tags/$TAG^{}")
          if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checkout не соответствует тегу $TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Установить zip
        run: |
          apt-get update -qq
          apt-get install -y -qq zip jq

      # best-effort, как в build.yml: pkg.devkitpro.org может отдать 403
      # (rate-limit), но образ уже несёт нужные portlibs -- не валим релиз.
      - name: Дотянуть switch-* зависимости (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          (yes | sudo -E dkp-pacman -Syu --noconfirm) \
            || (yes | dkp-pacman -Syu --noconfirm) \
            || echo "::warning::pacman -Syu failed; will rely on image contents"
          dkp-pacman -S --needed --noconfirm \
            switch-curl switch-zlib switch-libpng \
            switch-mbedtls switch-bzip2 switch-libjpeg-turbo \
            switch-pkg-config switch-glm switch-libjson-c \
            || echo "::warning::pacman -S failed; using whatever's in the image"

      - name: Сборка
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Хвост лога при ошибке
        if: failure()
        shell: bash
        run: |
          echo "============== last 200 lines of build.log =============="
          tail -n 200 build.log || true
          echo "============== grep error markers ======================="
          grep -nE 'error:|undefined reference|fatal error|multiple definition' build.log | tail -n 50 || true

      - name: Собрать релизные архивы
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          test -d out || { echo "::error::Каталог out не создан сборкой"; exit 1; }
          # Makefile допускает локальную минимальную сборку без bundle, однако
          # GitHub Release обязан включать весь готовый SD bundle. Проверяем
          # артефакты nx-ovlloader до упаковки, чтобы не выпускать урезанный zip.
          for asset in \
            atmosphere/contents/420000000007E51A/exefs.nsp \
            atmosphere/contents/420000000007E51B/exefs.nsp \
            switch/Ryazhahand-Reload/Ryazhahand-Reload.nro; do
            test -s "out/$asset" || { echo "::error::Отсутствует обязательный release-артефакт: $asset"; exit 1; }
          done
          mkdir -p release

          # В релиз кладём ТОЛЬКО sdout.zip (полный SD-card-ready bundle).
          # Отдельные ovlmenu.ovl / lang.zip / версионный дубль убраны по
          # просьбе -- они только захламляли список ассетов.

          # sdout.zip -- полный SD-card-ready bundle. Структура out/:
          #      switch/.overlays/ovlmenu.ovl
          #      switch/Ryazhahand-Reload/Ryazhahand-Reload.nro     (reload-хелпер из nx-ovlloader, ребрендинг)
          #      atmosphere/contents/0100000000000ED1/              (Ryazha-LED sysmodule)
          #      atmosphere/contents/420000000007E51A + E51B/       (nx-ovlloader v2.0.2)
          #      atmosphere/exefs_patches/audio_mastervolume/*.ips  (master vol патчи)
          #      config/ryazhahand/lang/*.json
          #      config/ryazhahand/sounds/default.zip          (звуковой пак для выбора в UI)
          #      config/ryazhahand/.loaded_sounds/*.wav         (активный пак default, звучит из коробки)
          #      config/ryazhahand/themes/*.ini
          #      config/ryazhahand/payloads/ultrahand_updater.bin
          #    Юзер распаковывает в корень SD-карты -- работает из коробки.
          (cd out && zip -r "../release/sdout.zip" .)
          test -s release/sdout.zip || { echo "::error::sdout.zip не был создан"; exit 1; }
          ls -la release/

      - name: Получить changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=""
          if [ -f docs/CHANGELOG_RU.md ]; then
            # Извлекаем секцию текущей версии (## [v2.3.0] ... ## [v2.2.x])
            VERSION="${TAG#v}"
            NOTES=$(awk -v ver="$VERSION" '
              /^## *\[?v?'"$VERSION"'\]?/ { found=1; next }
              found && /^## *\[?v?[0-9]+\./ { exit }
              found { print }
            ' docs/CHANGELOG_RU.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Релиз $TAG — см. коммиты с предыдущего тега."
          fi
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> $GITHUB_OUTPUT

      - name: Снести существующий релиз для тега (чистая перезапись ассетов)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --location --output "$response" \
            --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api/releases/tags/$TAG")
          case "$status" in
            200)
              rid=$(jq -er '.id' "$response")
              echo "Существующий релиз $rid для $TAG -- удаляю (ассеты пересоздадутся)"
              curl --fail --silent --show-error --location -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" "$api/releases/$rid"
              ;;
            404)
              echo "Релиза для $TAG ещё нет -- будет создан новый"
              ;;
            *)
              echo "::error::Не удалось получить релиз для $TAG (HTTP $status)"
              cat "$response"
              exit 1
              ;;
          esac

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Ryzhand Overlay ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            release/sdout.zip
          draft: false
          prerelease: false
