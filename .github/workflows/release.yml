# Author: Dimasick-git
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v2.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Релиз ${{ github.ref_name }}
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Определить тег
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Установить zip
        run: |
          apt-get update -qq
          apt-get install -y -qq zip

      - name: Установить switch-* зависимости
        run: |
          set -e
          (yes | sudo -E dkp-pacman -Syu --noconfirm) || \
            (yes | dkp-pacman -Syu --noconfirm)
          dkp-pacman -S --needed --noconfirm \
            switch-curl switch-zlib switch-libpng \
            switch-mbedtls switch-bzip2 switch-libjpeg-turbo \
            switch-pkg-config switch-glm switch-libjson-c || true

      - name: Сборка
        run: |
          export DEVKITPRO=/opt/devkitpro
          make -j$(nproc)

      - name: Собрать релизные архивы
        id: archive
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p release

          # 1) Главный .ovl: ровно ovlmenu.ovl без префикса -- так его
          #    ожидает Tesla-loader. Версия в zip name ниже.
          cp ovlmenu.ovl "release/ovlmenu.ovl"

          # 2) lang.zip -- отдельный архив только с переводами
          #    (минимальное обновление для юзеров, которые уже всё имеют).
          #    Структура такая же как у upstream: config/ryazhahand/lang/*.json.
          if [ -d out/config/ryazhahand/lang ]; then
            (cd out && zip -r "../release/lang.zip" config/ryazhahand/lang)
          fi

          # 3) sdout.zip -- полный SD-card-ready bundle. Структура out/:
          #      switch/.overlays/ovlmenu.ovl
          #      switch/Ultrahand-Reload/Ultrahand-Reload.nro       (helper из nx-ovlloader, имя сохраняем для совместимости)
          #      atmosphere/contents/0100000000000ED1/              (Ryazha-LED sysmodule)
          #      atmosphere/contents/420000000007E51A + E51B/       (nx-ovlloader v2.0.2)
          #      atmosphere/exefs_patches/audio_mastervolume/*.ips  (master vol патчи)
          #      config/ryazhahand/lang/*.json
          #      config/ryazhahand/sounds/*.wav
          #      config/ryazhahand/.sounds/default.zip
          #      config/ryazhahand/themes/*.ini
          #      config/ryazhahand/payloads/ultrahand_updater.bin
          #    Юзер распаковывает в корень SD-карты -- работает из коробки.
          if [ -d out ]; then
            (cd out && zip -r "../release/sdout.zip" .)
            # Версионный alias для бэк-совместимости со старыми ссылками.
            cp "release/sdout.zip" "release/Ryazhahand-Overlay-${TAG}.zip"
          fi

          ls -la release/

      - name: Получить changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=""
          if [ -f docs/CHANGELOG_RU.md ]; then
            # Извлекаем секцию текущей версии (## [v2.3.0] ... ## [v2.2.x])
            VERSION="${TAG#v}"
            NOTES=$(awk -v ver="$VERSION" '
              /^## *\[?v?'"$VERSION"'\]?/ { found=1; next }
              found && /^## *\[?v?[0-9]+\./ { exit }
              found { print }
            ' docs/CHANGELOG_RU.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Релиз $TAG — см. коммиты с предыдущего тега."
          fi
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> $GITHUB_OUTPUT

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Ryzhand Overlay ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            release/ovlmenu.ovl
            release/lang.zip
            release/sdout.zip
            release/Ryazhahand-Overlay-*.zip
          draft: false
          prerelease: false
