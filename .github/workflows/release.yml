# Author: Dimasick-git
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v2.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Релиз ${{ github.ref_name }}
    runs-on: ubuntu-latest
    container:
      # Пинимся на тот же образ, что и build.yml -- он проверенно собирает
      # проект. :latest мог подтянуть другой тулчейн и сломать релиз.
      image: devkitpro/devkita64:20251231
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Определить тег
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Установить zip
        run: |
          apt-get update -qq
          apt-get install -y -qq zip

      # best-effort, как в build.yml: pkg.devkitpro.org может отдать 403
      # (rate-limit), но образ уже несёт нужные portlibs -- не валим релиз.
      - name: Дотянуть switch-* зависимости (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          (yes | sudo -E dkp-pacman -Syu --noconfirm) \
            || (yes | dkp-pacman -Syu --noconfirm) \
            || echo "::warning::pacman -Syu failed; will rely on image contents"
          dkp-pacman -S --needed --noconfirm \
            switch-curl switch-zlib switch-libpng \
            switch-mbedtls switch-bzip2 switch-libjpeg-turbo \
            switch-pkg-config switch-glm switch-libjson-c \
            || echo "::warning::pacman -S failed; using whatever's in the image"

      - name: Сборка
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Хвост лога при ошибке
        if: failure()
        shell: bash
        run: |
          echo "============== last 200 lines of build.log =============="
          tail -n 200 build.log || true
          echo "============== grep error markers ======================="
          grep -nE 'error:|undefined reference|fatal error|multiple definition' build.log | tail -n 50 || true

      - name: Собрать релизные архивы
        id: archive
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p release

          # 1) Главный .ovl: ровно ovlmenu.ovl без префикса -- так его
          #    ожидает Tesla-loader. Версия в zip name ниже.
          cp ovlmenu.ovl "release/ovlmenu.ovl"

          # 2) lang.zip -- отдельный архив только с переводами
          #    (минимальное обновление для юзеров, которые уже всё имеют).
          #    Структура такая же как у upstream: config/ryazhahand/lang/*.json.
          if [ -d out/config/ryazhahand/lang ]; then
            (cd out && zip -r "../release/lang.zip" config/ryazhahand/lang)
          fi

          # 3) sdout.zip -- полный SD-card-ready bundle. Структура out/:
          #      switch/.overlays/ovlmenu.ovl
          #      switch/Ryazhahand-Reload/Ryazhahand-Reload.nro     (reload-хелпер из nx-ovlloader, ребрендинг)
          #      atmosphere/contents/0100000000000ED1/              (Ryazha-LED sysmodule)
          #      atmosphere/contents/420000000007E51A + E51B/       (nx-ovlloader v2.0.2)
          #      atmosphere/exefs_patches/audio_mastervolume/*.ips  (master vol патчи)
          #      config/ryazhahand/lang/*.json
          #      config/ryazhahand/sounds/*.wav
          #      config/ryazhahand/.sounds/default.zip
          #      config/ryazhahand/themes/*.ini
          #      config/ryazhahand/payloads/ultrahand_updater.bin
          #    Юзер распаковывает в корень SD-карты -- работает из коробки.
          if [ -d out ]; then
            (cd out && zip -r "../release/sdout.zip" .)
            # Версионный alias для бэк-совместимости со старыми ссылками.
            cp "release/sdout.zip" "release/Ryazhahand-Overlay-${TAG}.zip"
          fi

          ls -la release/

      - name: Получить changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=""
          if [ -f docs/CHANGELOG_RU.md ]; then
            # Извлекаем секцию текущей версии (## [v2.3.0] ... ## [v2.2.x])
            VERSION="${TAG#v}"
            NOTES=$(awk -v ver="$VERSION" '
              /^## *\[?v?'"$VERSION"'\]?/ { found=1; next }
              found && /^## *\[?v?[0-9]+\./ { exit }
              found { print }
            ' docs/CHANGELOG_RU.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Релиз $TAG — см. коммиты с предыдущего тега."
          fi
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> $GITHUB_OUTPUT

      - name: Снести существующий релиз для тега (чистая перезапись ассетов)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Если релиз для этого тега уже существует -- удаляем его (тег
          # остаётся на месте). Следующий шаг пересоздаст релиз с свежими
          # файлами. Так повторный запуск на том же теге ПЕРЕЗАПИСЫВАЕТ ассеты,
          # а не падает на 422 "asset already exists" и не плодит дубликаты.
          rid=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*')
          if [ -n "$rid" ]; then
            echo "Существующий релиз $rid для $TAG -- удаляю (ассеты пересоздадутся)"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$rid" \
              -o /dev/null -w "delete release -> %{http_code}\n"
          else
            echo "Релиза для $TAG ещё нет -- будет создан новый"
          fi

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Ryzhand Overlay ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            release/ovlmenu.ovl
            release/lang.zip
            release/sdout.zip
            release/Ryazhahand-Overlay-*.zip
          draft: false
          prerelease: false
