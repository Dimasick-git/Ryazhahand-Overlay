# Author: Dimasick-git
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.pics/**'
      - 'examples/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка ovlmenu.ovl
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20251231
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Информация о devkitPro
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-gcc --version | head -1

      # Образ devkitpro/devkita64:20251231 уже несёт нужные portlibs.
      # Pacman оставлен на случай, когда CI поднимется на свежий image
      # без какой-нибудь библиотеки -- но не должен валить весь job, если
      # pkg.devkitpro.org вернёт 403 (rate-limit / временный outage).
      - name: Дотянуть switch-* зависимости (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          (yes | sudo -E dkp-pacman -Syu --noconfirm) \
            || (yes | dkp-pacman -Syu --noconfirm) \
            || echo "::warning::pacman -Syu failed; will rely on image contents"
          dkp-pacman -S --needed --noconfirm \
            switch-curl switch-zlib switch-libpng \
            switch-mbedtls switch-bzip2 switch-libjpeg-turbo \
            switch-pkg-config switch-glm switch-libjson-c \
            || echo "::warning::pacman -S failed; using whatever's in the image"

      - name: make
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          # Захватываем полный лог сборки в файл, чтобы при падении
          # шага показать хвост ошибок без admin-прав на job logs.
          # Контейнер devkitpro/devkita64 по умолчанию использует sh,
          # поэтому shell: bash явно -- иначе set -o pipefail падает.
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Хвост лога при ошибке
        if: failure()
        shell: bash
        run: |
          echo "============== last 200 lines of build.log =============="
          tail -n 200 build.log || true
          echo "============== grep error markers ======================="
          grep -nE 'error:|undefined reference|fatal error|multiple definition' build.log | tail -n 50 || true

      - name: Подготовить артефакты
        run: |
          mkdir -p artifacts
          # Сохраняем имя ovlmenu.ovl как есть -- так его ожидает Tesla-loader
          # и Tesla overlay экосистема. out/ уже содержит правильную
          # SD-структуру (switch/.overlays/ovlmenu.ovl + atmosphere/contents/
          # 0100000000000ED1 (единый Ryazha-LED sysmodule) + config/ryazhahand/lang/).
          if [ -f ovlmenu.ovl ]; then cp ovlmenu.ovl artifacts/ovlmenu.ovl; fi
          if [ -d out ]; then cp -r out artifacts/out; fi
          ls -la artifacts/

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ovlmenu-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
